<section class="relative min-h-screen overflow-hidden bg-gray-50 dark:bg-gray-950 bg-mesh">

  <!-- Animated background blobs -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-32 -left-24 w-[420px] h-[420px] bg-indigo-400/30 dark:bg-indigo-500/20 blur-3xl animate-blob"></div>
    <div class="absolute top-1/3 -right-24 w-[480px] h-[480px] bg-fuchsia-400/25 dark:bg-fuchsia-500/20 blur-3xl animate-blob" style="animation-delay:-6s"></div>
    <div class="absolute -bottom-24 left-1/3 w-[420px] h-[420px] bg-sky-400/25 dark:bg-sky-500/20 blur-3xl animate-blob" style="animation-delay:-10s"></div>
  </div>

  <div class="relative flex flex-col items-center justify-center px-6 py-10 mx-auto min-h-screen">
    <a href="#" class="flex items-center mb-6 text-2xl font-semibold text-gray-900 dark:text-white animate-fade-in-down">
      <span class="relative flex items-center justify-center w-10 h-10 mr-3 rounded-xl bg-linear-to-br from-indigo-500 via-violet-500 to-fuchsia-500 shadow-lg shadow-indigo-500/40 animate-float">
        <img class="w-6 h-6" src="https://flowbite.s3.amazonaws.com/blocks/marketing-ui/logo.svg" alt="logo">
      </span>
      <span class="text-gradient">Münster</span>
    </a>

    <div class="relative w-full sm:max-w-md animate-scale-in">
      <!-- Decorative gradient border -->
      <div class="absolute -inset-[1px] rounded-2xl bg-linear-to-r from-indigo-500 via-fuchsia-500 to-sky-500 opacity-60 blur-sm animate-gradient"></div>

      <div class="relative glass rounded-2xl shadow-2xl shadow-indigo-500/10 overflow-hidden">
        <div class="p-6 space-y-5 md:space-y-6 sm:p-8">
          <div class="animate-fade-in-up">
            <h1 class="text-2xl font-bold leading-tight tracking-tight text-gray-900 dark:text-white">
              Willkommen zurück
            </h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
              Melde dich mit deinem Account an
            </p>
          </div>

          <form class="space-y-4 md:space-y-5" (submit)="$event.preventDefault(); onSubmit()">
            <div class="animate-fade-in-up stagger-1">
              <label for="username" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Benutzername</label>
              <div class="relative group">
                <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 group-focus-within:text-indigo-500 transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                </span>
                <input
                  [(ngModel)]="inputUsername"
                  type="text"
                  name="username"
                  id="username"
                  placeholder="Benutzername"
                  required
                  class="bg-white/60 dark:bg-gray-800/60 border border-gray-300/80 dark:border-gray-700 text-gray-900 dark:text-white rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-10 p-2.5 transition-all duration-200 placeholder:text-gray-400 dark:placeholder-gray-500"
                >
              </div>
            </div>

            <div class="animate-fade-in-up stagger-2">
              <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Passwort</label>
              <div class="relative group">
                <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 group-focus-within:text-indigo-500 transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                  </svg>
                </span>
                <input
                  [(ngModel)]="inputPassword"
                  type="password"
                  name="password"
                  id="password"
                  placeholder="••••••••"
                  required
                  class="bg-white/60 dark:bg-gray-800/60 border border-gray-300/80 dark:border-gray-700 text-gray-900 dark:text-white rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-10 p-2.5 transition-all duration-200 placeholder:text-gray-400 dark:placeholder-gray-500"
                >
              </div>
            </div>

            <div class="flex items-center justify-between animate-fade-in-up stagger-3">
              <label class="inline-flex items-center gap-2 cursor-pointer text-sm text-gray-500 dark:text-gray-300 select-none">
                <input id="remember" type="checkbox" class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 dark:bg-gray-700 dark:border-gray-600 transition">
                Angemeldet bleiben
              </label>
              <a href="#" class="text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:underline">
                Passwort vergessen?
              </a>
            </div>

            <button
              type="submit"
              class="btn-shine press relative w-full text-white font-medium rounded-lg text-sm px-5 py-2.5 animate-fade-in-up stagger-4
                     bg-linear-to-r from-indigo-600 via-violet-600 to-fuchsia-600
                     hover:from-indigo-500 hover:via-violet-500 hover:to-fuchsia-500
                     shadow-lg shadow-indigo-600/30 hover:shadow-fuchsia-500/40
                     transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-indigo-500/40"
            >
              Anmelden
            </button>

            <p class="text-sm text-gray-500 dark:text-gray-400 text-center animate-fade-in-up stagger-5">
              Haben Sie noch kein Konto?
              <a href="#" class="font-medium text-indigo-600 hover:underline dark:text-indigo-400">Administrator</a>
            </p>
          </form>
        </div>
      </div>
    </div>

    <p class="mt-6 text-xs text-gray-400 dark:text-gray-500 animate-fade-in stagger-6">
      © Münster Panel — sicher &middot; schnell &middot; zuverlässig
    </p>
  </div>
</section>
