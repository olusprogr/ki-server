<div class="flex flex-col h-[calc(100vh-6rem)] animate-fade-in">

  <!-- Operation Buttons -->
  <div class="flex flex-wrap gap-2 mb-4 animate-fade-in-down">
    <button
      *ngFor="let op of validOperations; let i = index"
      (click)="sendOperation(op)"
      [style.animation-delay.ms]="50 * i"
      class="btn-shine press animate-fade-in-up text-white font-medium rounded-xl text-sm px-4 py-2
             bg-linear-to-r from-indigo-600 to-violet-600
             hover:from-indigo-500 hover:to-violet-500
             shadow-md shadow-indigo-500/20 hover:shadow-indigo-500/40
             focus:ring-4 focus:outline-none focus:ring-indigo-500/40
             transition-all duration-300"
    >
      {{ op | titlecase }}
    </button>
  </div>

  <!-- Console Header -->
  <div class="bg-white dark:bg-gray-900/70 backdrop-blur-xl rounded-t-2xl
              border border-b-0 border-gray-200/70 dark:border-gray-800 p-4 animate-fade-in-up">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <div aria-hidden="true" class="flex gap-1.5">
          <span class="w-3 h-3 rounded-full bg-red-400/80"></span>
          <span class="w-3 h-3 rounded-full bg-amber-400/80"></span>
          <span class="w-3 h-3 rounded-full bg-green-400/80"></span>
        </div>
        <h1 class="text-base font-bold tracking-tight text-gray-900 dark:text-white">WebSocket Konsole</h1>
      </div>

      <div class="flex items-center gap-3">
        <span class="text-xs text-gray-500 dark:text-gray-400 font-mono px-2 py-1 rounded-md bg-gray-100 dark:bg-gray-800">
          ws://localhost:8080
        </span>
        <div class="flex items-center gap-2 px-2.5 py-1 rounded-full"
             [ngClass]="isConnected
               ? 'bg-green-500/10 border border-green-500/20'
               : 'bg-red-500/10 border border-red-500/20'">
          <span class="relative flex h-2 w-2">
            <span *ngIf="isConnected" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2"
                  [class.bg-green-500]="isConnected" [class.bg-red-500]="!isConnected"></span>
          </span>
          <span class="text-xs font-semibold"
                [class.text-green-700]="isConnected" [class.dark:text-green-300]="isConnected"
                [class.text-red-600]="!isConnected" [class.dark:text-red-300]="!isConnected">
            {{ isConnected ? 'Verbunden' : 'Getrennt' }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Message Log -->
  <div class="flex-1 bg-gray-50/70 dark:bg-gray-950/60 overflow-y-auto p-4 space-y-3
              border-x border-gray-200/70 dark:border-gray-800">
    <div *ngFor="let msg of messageLog; trackBy: trackMessage">

      <!-- System Message -->
      <div *ngIf="msg.type === 'system'" class="flex justify-center">
        <div class="bg-gray-100/80 dark:bg-gray-800/80 backdrop-blur-sm text-gray-500 dark:text-gray-400
                    px-4 py-1.5 rounded-full text-xs border border-gray-200 dark:border-gray-700">
          <span class="font-mono">{{ msg.content }}</span>
          <span class="text-gray-400 dark:text-gray-500 ml-2">{{ msg.timestamp | date:'HH:mm:ss' }}</span>
        </div>
      </div>

      <!-- Sent Message -->
      <div *ngIf="msg.type === 'sent'" class="flex justify-end">
        <div class="max-w-md">
          <div class="bg-linear-to-br from-indigo-600 to-violet-600 text-white px-4 py-3 rounded-2xl rounded-tr-sm
                      shadow-lg shadow-indigo-500/20">
            <p class="font-mono text-sm wrap-break-word">{{ msg.content }}</p>
            <p class="text-[11px] text-indigo-100/90 mt-1">{{ msg.timestamp | date:'HH:mm:ss' }}</p>
          </div>
        </div>
      </div>

      <!-- Received Message -->
      <div *ngIf="msg.type === 'received'" class="flex justify-start">
        <div class="max-w-md">
          <div class="bg-white dark:bg-gray-800/90 text-gray-900 dark:text-white px-4 py-3 rounded-2xl rounded-tl-sm
                      shadow-sm border border-gray-200/70 dark:border-gray-700/70">
            <p class="font-mono text-sm wrap-break-word">{{ msg.content }}</p>
            <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-1">{{ msg.timestamp | date:'HH:mm:ss' }}</p>
          </div>
        </div>
      </div>

    </div>

    <!-- Empty state -->
    <div *ngIf="messageLog.length === 0" class="flex flex-col items-center justify-center py-12 opacity-70 animate-fade-in">
      <div class="w-14 h-14 rounded-2xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center mb-3 animate-float">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
      </div>
      <p class="text-sm text-gray-400 dark:text-gray-500">Noch keine Nachrichten</p>
    </div>
  </div>

  <!-- Input Bar -->
  <div class="bg-white dark:bg-gray-900/70 backdrop-blur-xl rounded-b-2xl
              border border-t-0 border-gray-200/70 dark:border-gray-800 p-4 animate-fade-in-up">
    <div class="flex gap-3">
      <div class="relative flex-1 group">
        <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 group-focus-within:text-indigo-500 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </span>
        <input
          type="text"
          [(ngModel)]="messageInput"
          (keyup.enter)="sendMessage()"
          [disabled]="!isConnected"
          placeholder="Nachricht eingeben..."
          class="w-full bg-gray-50 dark:bg-gray-800/60 border border-gray-300/80 dark:border-gray-700
                 text-gray-900 dark:text-white rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
                 pl-10 p-2.5 text-sm font-mono transition-all duration-200
                 placeholder:text-gray-400 dark:placeholder-gray-500
                 disabled:opacity-50 disabled:cursor-not-allowed"
        >
      </div>

      <button
        (click)="sendMessage()"
        [disabled]="!isConnected || !messageInput.trim()"
        class="btn-shine press group text-white font-medium rounded-xl text-sm px-5 py-2.5
               bg-linear-to-r from-indigo-600 to-violet-600
               hover:from-indigo-500 hover:to-violet-500
               shadow-md shadow-indigo-500/20 hover:shadow-indigo-500/40
               focus:ring-4 focus:outline-none focus:ring-indigo-500/40
               disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none
               flex items-center gap-2 transition-all duration-300"
      >
        <svg class="w-4 h-4 transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
        </svg>
        Senden
      </button>
    </div>
  </div>

</div>
