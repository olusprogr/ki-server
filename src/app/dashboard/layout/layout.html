<div class="relative flex min-h-screen bg-gray-50 dark:bg-slate-800 bg-mesh">

  <app-navbar
    [isMobile]="isMobile"
    [menuOpen]="menuOpen"
    (closeMenu)="closeMenu()"
  ></app-navbar>

  <!-- Mobile overlay -->
  <div
    *ngIf="menuOpen && isMobile"
    class="fixed inset-0 bg-black/40 backdrop-blur-md z-40 animate-fade-in"
    (click)="toggleMenu()"
  ></div>

  <main class="flex-1 p-5 md:p-8 relative">

    <!-- Mobile menu button -->
    <div *ngIf="isMobile && !menuOpen" class="fixed top-4 left-4 z-40 animate-fade-in-down">
      <button
        (click)="toggleMenu()"
        aria-label="Menü öffnen"
        class="glass press group p-2.5 rounded-xl shadow-lg
               text-gray-700 dark:text-gray-200
               hover:shadow-indigo-500/30 hover:shadow-xl
               transition-all duration-300"
      >
        <svg class="w-5 h-5 transition-transform group-hover:rotate-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

    <div class="max-w-7xl mx-auto animate-fade-in">
      <router-outlet></router-outlet>
    </div>

  </main>

</div>
